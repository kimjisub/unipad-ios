name: Bug report
description: A crash, wrong behavior, or a Launchpad that does not work
title: "[Bug] "
labels: ["bug", "platform:ios", "waiting:agent"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. English or Korean is fine (한국어로 써도 됩니다).
        The version and device fields are what we need most; a report without them usually stalls on a follow-up question.
  - type: input
    id: app-version
    attributes:
      label: UniPad version and build
      description: Settings > Info in the app, or TestFlight
      placeholder: "4.1.4 (3)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone or iPad model
      placeholder: "iPhone 15 Pro, iPad Air (M2), ..."
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS or iPadOS version
      description: UniPad requires iOS 26.2 or later.
      placeholder: "26.2"
    validations:
      required: true
  - type: dropdown
    id: launchpad
    attributes:
      label: Launchpad or MIDI device
      options:
        - None (touch screen only)
        - Launchpad S / Mini (original)
        - Launchpad MK2
        - Launchpad Pro
        - Launchpad X
        - Launchpad Mini MK3
        - Launchpad Pro MK3
        - Matrix
        - Midi Fighter
        - Master keyboard / other MIDI keyboard
        - Other (name it in the steps)
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How is it connected?
      options:
        - Not connected
        - USB-C directly
        - Lightning camera adapter
        - USB hub or dock
        - Bluetooth MIDI
    validations:
      required: true
  - type: dropdown
    id: without-hardware
    attributes:
      label: Does it also happen with no Launchpad connected?
      description: This tells us whether we can reproduce it in the simulator or need the hardware.
      options:
        - "Yes, it also happens with no Launchpad connected"
        - "No, only when the Launchpad is connected"
        - "Not applicable (I do not use a Launchpad)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open UniPad
        2. Plug in the Launchpad
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log (if it crashed)
      description: Settings > Privacy & Security > Analytics & Improvements > Analytics Data, then files starting with `unipad-`. Share the newest one, or say you cannot and we will look on our side.
      render: text
  - type: input
    id: unipack
    attributes:
      label: UniPack (if it only happens with one)
      description: Its name and where you got it (store link or download URL). To share the file itself, zip it and drag it into the steps box above.
      placeholder: "Faded (store), or https://..."
