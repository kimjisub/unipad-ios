name: iOS checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    # Use the same Xcode as release builds. Xcode 26 infers isolation differently: a protocol
    # declared in the app (default isolation MainActor) is nonisolated there and main-actor
    # isolated in Xcode 27, so the two accept and reject different code.
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare fake test configuration
        run: |
          python3 -m unittest discover -s ci -v
          python3 ci/firebase_fixture.py unipad/GoogleService-Info.plist

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json
          import os
          import subprocess

          # The image carries newer simulator runtimes than the selected Xcode can run.
          sdk = subprocess.check_output(
              ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True
          ).strip()
          runtime_key = f".iOS-{sdk.replace('.', '-')}"
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json']
          ))['devices']
          iphones = [device for runtime, items in devices.items()
                     if runtime.endswith(runtime_key) for device in items
                     if device['name'].startswith('iPhone') and device['isAvailable']]
          if not iphones:
              raise SystemExit(f'No available iPhone simulator on iOS {sdk}')
          device = next((d for d in iphones if d['name'] == 'iPhone 17'), iphones[0])
          print(f"Using {device['name']} ({device['udid']})")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"udid={device['udid']}\n")
          PY

      - name: Resolve pinned dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project unipad.xcodeproj -scheme unipad \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      # UNIPAD_WARNINGS_AS_ERRORS turns warnings into errors for UniPad's own targets only.
      # Passing SWIFT_TREAT_WARNINGS_AS_ERRORS here would also reach the Swift packages, which
      # build with -suppress-warnings, and the compiler rejects the two options together.
      - name: Build Release for iOS Simulator without signing
        run: |
          xcodebuild build -quiet \
            -project unipad.xcodeproj -scheme unipad -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            UNIPAD_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Check open source notices against the build
        run: |
          python3 ci/open_source_licenses.py check \
            --derived-data "$RUNNER_TEMP/DerivedData" \
            --source-packages "$RUNNER_TEMP/SourcePackages"

      - name: Run unit tests without UI tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test -quiet \
            -project unipad.xcodeproj -scheme unipad -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:unipadTests -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            UNIPAD_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Summarize unit test results
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/UnitTests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/UnitTests.xcresult" --compact \
              | tee "$RUNNER_TEMP/test-summary.json"
          fi

      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-check-results
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/test-summary.json
            ${{ runner.temp }}/UnitTests.xcresult
          retention-days: 7
          if-no-files-found: ignore
