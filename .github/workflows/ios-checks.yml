name: iOS checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare fake test configuration
        run: |
          python3 -m unittest discover -s ci -v
          python3 ci/firebase_fixture.py unipad/GoogleService-Info.plist

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json
          import os
          import subprocess

          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json']
          ))['devices']
          iphones = [device for runtime, items in sorted(devices.items(), reverse=True)
                     if '.iOS-' in runtime for device in items
                     if device['name'].startswith('iPhone') and device['isAvailable']]
          if not iphones:
              raise SystemExit('No available iPhone simulator')
          device = iphones[0]
          print(f"Using {device['name']} ({device['udid']})")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"udid={device['udid']}\n")
          PY

      - name: Resolve pinned dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project unipad.xcodeproj -scheme unipad \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release for iOS Simulator without signing
        run: |
          xcodebuild build -quiet \
            -project unipad.xcodeproj -scheme unipad -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Run unit tests without UI tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test -quiet \
            -project unipad.xcodeproj -scheme unipad -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:unipadTests -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Summarize unit test results
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/UnitTests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/UnitTests.xcresult" --compact \
              | tee "$RUNNER_TEMP/test-summary.json"
          fi

      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-check-results
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/test-summary.json
            ${{ runner.temp }}/UnitTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    runs-on: xcode-27
    # The complete 86-test suite took 59 minutes locally before hosted setup.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare fake test configuration
        run: |
          python3 -m unittest discover -s ci -v
          python3 ci/firebase_fixture.py unipad/GoogleService-Info.plist

      - name: Select the reference iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json
          import os
          import subprocess

          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json']
          ))['devices']
          iphones = [device for runtime, items in sorted(devices.items(), reverse=True)
                     if runtime.endswith('.iOS-27-0') for device in items
                     if device['name'] == 'iPhone 17 Pro' and device['isAvailable']]
          if not iphones and os.environ.get('GITHUB_ACTIONS') == 'true':
              # Hosted images may include the runtime without precreating this model.
              # Local devices must still be borrowed through the maintenance harness.
              runtimes = json.loads(subprocess.check_output(
                  ['xcrun', 'simctl', 'list', 'runtimes', '--json']
              ))['runtimes']
              device_types = json.loads(subprocess.check_output(
                  ['xcrun', 'simctl', 'list', 'devicetypes', '--json']
              ))['devicetypes']
              runtime = next((item for item in runtimes
                              if item['identifier'].endswith('.iOS-27-0')
                              and item['isAvailable']), None)
              reference_type = 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro'
              if runtime and any(item['identifier'] == reference_type for item in device_types):
                  udid = subprocess.check_output(
                      ['xcrun', 'simctl', 'create', 'UniPad UI reference',
                       reference_type, runtime['identifier']], text=True
                  ).strip()
                  if not udid:
                      raise SystemExit('Creating the reference simulator returned no device id')
                  iphones = [{'name': 'iPhone 17 Pro', 'udid': udid}]
              else:
                  print(json.dumps({'devices': devices, 'runtimes': runtimes,
                                    'devicetypes': device_types}, indent=2))
          if not iphones:
              raise SystemExit('No iPhone 17 Pro on iOS 27 for the complete UI suite, including VoiceOver')
          device = iphones[0]
          print(f"Using {device['name']} ({device['udid']})")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"udid={device['udid']}\n")
          PY

      - name: Resolve pinned dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project unipad.xcodeproj -scheme unipad \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Run all UI tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_UNIPAD_RELEASE_SUITE: '1'
        run: |
          ci/host-keys.sh "$SIMULATOR_UDID" "$RUNNER_TEMP/DerivedData" test -quiet \
            -project unipad.xcodeproj -scheme unipad -configuration Debug \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:unipadUITests \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/ui-tests.log"

      - name: Require every UI test to run and pass
        if: always()
        run: |
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/UITests.xcresult" --compact \
            | tee "$RUNNER_TEMP/ui-test-summary.json"
          python3 ci/check_ui_results.py "$RUNNER_TEMP/ui-test-summary.json"

      - name: Save UI test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ui-check-results
          path: |
            ${{ runner.temp }}/ui-tests.log
            ${{ runner.temp }}/ui-test-summary.json
            ${{ runner.temp }}/UITests.xcresult
          retention-days: 7
          if-no-files-found: ignore
