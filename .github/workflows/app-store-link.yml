name: App Store link

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'unipad/Views/Main/MainView.swift'
      - 'ci/app_store_link.py'
      - 'ci/test_app_store_link.py'
      - '.github/workflows/app-store-link.yml'

permissions:
  contents: read

jobs:
  check-link:
    name: Check Apple web destination
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check App Store link
        shell: bash
        run: |
          status=0
          python3 ci/app_store_link.py --out app-store-link.json || status=$?
          if [[ "$status" -eq 2 ]]; then
            echo '::warning::스토어 접속 불가, 주소 오류 아님'
          else
            exit "$status"
          fi

      - name: Save destination evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-store-link-results
          path: app-store-link.json
          retention-days: 90
          if-no-files-found: error
